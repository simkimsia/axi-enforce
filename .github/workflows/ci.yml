name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # agents run on all three; path lookup, .exe/.cmd shims and shell quoting differ per OS
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run format:check
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
